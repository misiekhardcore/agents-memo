name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Format + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.0.2
        with:
          runtime: node@24
          cache: true
      - run: pnpm ci
        env:
          HUSKY: 0
      - run: pnpm run lint
      - run: pnpm run format
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.0.2
        with:
          runtime: node@24
          cache: true
      - run: pnpm ci
        env:
          HUSKY: 0
      - run: pnpm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.0.2
        with:
          runtime: node@24
          cache: true
      - run: pnpm ci
        env:
          HUSKY: 0
      - run: bash tests/regression/read-canvas.sh
      - run: bash tests/regression/pi-settings-tier.sh
      - run: bash tests/regression/prune-lint-guard.sh
      - run: bash tests/regression/index-section-insert.sh
      - run: bash tests/regression/lint-duplicate-headings.sh

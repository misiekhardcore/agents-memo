name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.0.2
        with:
          runtime: node@24
          cache: true
      - run: pnpm ci
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test

  release:
    name: Bump, tag, publish
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.0.2
        with:
          runtime: node@24
          cache: true

      - run: pnpm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          pnpm version ${{ inputs.version_bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4.9.1
        with:
          config: cliff.toml
          args: --verbose --latest --tag v${{ steps.bump.outputs.new }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Build
        run: pnpm run build

      - name: Commit and tag
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.bump.outputs.new }}"
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.new }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: v${{ steps.bump.outputs.new }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

      - name: Publish to pnpm
        run: pnpm publish --access public --provenance
